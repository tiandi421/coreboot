name: Coreboot Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential nasm bison flex libssl-dev bc libfdt-dev liblzma-dev libpng-dev qemu-utils qemu-system-x86 libgpiod-dev libpixman-1-dev python3 python3-pip python3-setuptools libsdl1.2-dev libsdl-gfx1.2-dev libfreetype6-dev libpixman-1-dev libncurses5-dev libncursesw5-dev libpci-dev libusb-1.0-0-dev libusbredirserver-dev libusbredirparser-dev libuuid-dev libpixman-1-dev libpixman-1-0 libpixman-1-0v5 libpixman-1-0v5:amd64 libpixman-1-0v5:i386 libpixman-1-dev:amd64 libpixman-1-dev:i386 libsdl1.2debian libsdl1.2debian:amd64 libsdl1.2debian:i386 libsdl1.2-dev:amd64 libsdl1.2-dev:i386 libsdl1.2debian libsdl1.2debian:amd64 libsdl1.2debian:i386 lib
